[project]
name = "corvidex-mcp"
version = "0.1.0"
description = "corvidex-mcp: an RTL-centric RAG and indexing MCP"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639: SPDX expression + explicit licence files (setuptools >= 77).
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sebastian Hellgren", email = "sebastian.hellgren@codecache.se" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "rag",
    "semantic-search",
    "embeddings",
    "vhdl",
    "verilog",
    "systemverilog",
    "hdl",
    "rtl",
    "fpga",
    "code-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.1,<3",
    "sqlite-vec>=0.1.9",
    "fastembed>=0.8",
    "pypdf>=4.0",
    "pydantic>=2.12",
    "tree-sitter-language-pack>=1.15.8",
]

[project.urls]
Homepage = "https://github.com/ru551n/corvidex-mcp"
Repository = "https://github.com/ru551n/corvidex-mcp"
Documentation = "https://github.com/ru551n/corvidex-mcp/blob/main/docs/configuration.md"
Issues = "https://github.com/ru551n/corvidex-mcp/issues"
Releases = "https://github.com/ru551n/corvidex-mcp/releases"

[project.scripts]
corvidex-mcp = "corvidex_mcp.server:main"

[build-system]
# >= 77 for PEP 639 (license = "MIT" + license-files).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Bundle the embedded model assets (ONNX weights + tokenizer/config
# files) into the wheel so an air-gapped install needs no download.
# The ONNX weights are large and are gitignored (provisioned into the
# source tree by tools/bundle_model.py on the machine that builds the
# wheel); the small JSON files are committed.
#
# A plain `uv build` therefore produces the *slim*, PyPI-ready wheel:
# the weights are only present when bundle_model.py has been run, which
# tools/build_release.py does in a throwaway build copy for the offline
# bundle (version "<version>+offline"). The all-models wheel is ~0.8 GB
# and can never go to PyPI (100 MB per-file limit).
[tool.setuptools.package-data]
corvidex_mcp = [
    "assets/**/*",
    "py.typed",
]

[dependency-groups]
dev = [
    "mypy",
    # tools/build_release.py resolves the exported requirements'
    # environment markers per offline target itself (pip only ever
    # evaluates them for the interpreter it is running on).
    "packaging",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
# The quality-test corpus is fixture *data* (a miniature user
# repository being indexed), not project code: exempt from lint.
extend-exclude = ["tests/quality/corpus"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
