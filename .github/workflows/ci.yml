name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src

  quality-e2e:
    name: Quality (ubuntu-latest, real models)
    needs: quality
    # Full-pipeline RAG quality gate: indexes a small fixture corpus
    # with the real fastembed models and asserts a fixed query battery
    # retrieves the expected files (see docs/quality-testing.md).
    # ubuntu-latest only: it downloads the embedding model (~0.1 GB,
    # cached below) and runs ONNX inference, so it does not join the
    # cross-OS matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORVIDEX_RUN_QUALITY: "1"
      # Plain path (no ${{ }} expression): runner.temp is not
      # evaluable in the job-level env context. /tmp is writable and
      # ephemeral on hosted runners, which is what we want.
      CORVIDEX_QUALITY_DATA: /tmp/corvidex-quality
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Cache embedding models
        uses: actions/cache@v6
        with:
          path: /tmp/corvidex-quality/embed-cache
          # Bump -v3 when the default models (config defaults) or the
          # fastembed version change; see docs/quality-testing.md.
          key: corvidex-embed-cache-v3
          restore-keys: corvidex-embed-cache-v3
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run quality tests
        run: uv run pytest -v tests/test_quality.py

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macOS only on CPython 3.14: the uv standalone 3.12/3.13 macOS
        # interpreters link a SQLite without loadable-extension support,
        # so the store-dependent tests would skip wholesale there and
        # the jobs would verify nothing (see tests/capability.py).
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q

  test-rhel:
    name: Tests (${{ matrix.distro }}, py${{ matrix.python-version }})
    needs: quality
    # RHEL 9 and RHEL 10 have no hosted runners, so each runs as a
    # container on Ubuntu. The subscription-gated registry.redhat.com
    # rhel images need credentials, so the official UBI images are
    # used instead: free to pull, and they carry the same RHEL 9/10
    # user space (UBI 9 glibc 2.34 is the strictest floor in the
    # locked wheel set; UBI 10 is glibc 2.39, which is looser).
    # Python is not taken from the distro repos: uv provisions its own
    # standalone CPython (the same way a fresh user install works), so
    # the job only needs git + curl at runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Explicit combinations: GitHub's matrix-include merging would
        # collapse two include entries that share the same keys instead
        # of cross-multiplying them with python-version.
        include:
          - distro: "RHEL 9"
            image: "registry.access.redhat.com/ubi9/ubi:latest"
            python-version: "3.12"
          - distro: "RHEL 9"
            image: "registry.access.redhat.com/ubi9/ubi:latest"
            python-version: "3.13"
          - distro: "RHEL 9"
            image: "registry.access.redhat.com/ubi9/ubi:latest"
            python-version: "3.14"
          - distro: "RHEL 10"
            image: "registry.access.redhat.com/ubi10/ubi:latest"
            python-version: "3.12"
          - distro: "RHEL 10"
            image: "registry.access.redhat.com/ubi10/ubi:latest"
            python-version: "3.13"
          - distro: "RHEL 10"
            image: "registry.access.redhat.com/ubi10/ubi:latest"
            python-version: "3.14"
    container:
      image: ${{ matrix.image }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Install system packages
        run: |
          set -e
          # Install only what is missing: some base images ship
          # curl-minimal, which conflicts with the full curl package,
          # so an unconditional "install curl" would fail there.
          if command -v microdnf >/dev/null 2>&1; then PKG=microdnf; else PKG=dnf; fi
          command -v git  || $PKG install -y git
          command -v curl || $PKG install -y curl
          command -v git
          command -v curl
      - uses: actions/checkout@v7
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies (uv provisions CPython ${{ matrix.python-version }})
        run: $HOME/.local/bin/uv sync --frozen
      - name: Run tests
        run: $HOME/.local/bin/uv run pytest -q

  e2e-lsp:
    name: End-to-end tests (real vhdl_ls + Veridian, ru551n/hdl-docker)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ru551n/hdl-docker:1.2.0
      # The image's default user (hdl) can't apt-get install; run as root.
      options: --user root
    env:
      VHDL_LS_TEST_BIN: /opt/vhdl_ls/bin/vhdl_ls
      VERIDIAN_TEST_BIN: /opt/veridian/bin/veridian
    steps:
      - name: Install prerequisites (git, curl)
        run: |
          set -e
          apt-get update
          (command -v git  || apt-get install -y --no-install-recommends git)
          (command -v curl || apt-get install -y --no-install-recommends curl)
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
      - name: Assert the real LSP end-to-end tests really ran
        # Guards against the real vhdl_ls/Veridian tests being silently
        # skipped (e.g. if the image ever stops shipping these binaries
        # or moves their install paths): the whole point of this job is
        # a real vhdl_ls + Veridian LSP handshake, not the fakes used
        # elsewhere in the suite.
        run: |
          uv run python -c "
          import os
          from pathlib import Path
          vhdl_ls = os.environ['VHDL_LS_TEST_BIN']
          veridian = os.environ['VERIDIAN_TEST_BIN']
          assert Path(vhdl_ls).exists(), f'vhdl_ls not found at {vhdl_ls!r}'
          assert Path(veridian).exists(), f'veridian not found at {veridian!r}'
          "
