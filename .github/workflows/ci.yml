name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q

  test-rhel:
    name: Tests (${{ matrix.distro }}, py${{ matrix.python-version }})
    needs: quality
    # RHEL 9 and RHEL 10 have no hosted runners, so each runs as a
    # container on Ubuntu. The subscription-gated registry.redhat.com
    # rhel images need credentials, so the official UBI images are
    # used instead: free to pull, and they carry the same RHEL 9/10
    # user space (UBI 9 glibc 2.34 is the strictest floor in the
    # locked wheel set; UBI 10 is glibc 2.39, which is looser).
    # Python is not taken from the distro repos: uv provisions its own
    # standalone CPython (the same way a fresh user install works), so
    # the job only needs git + curl at runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Explicit combinations: GitHub's matrix-include merging would
        # collapse two include entries that share the same keys instead
        # of cross-multiplying them with python-version.
        include:
          - distro: "RHEL 9"
            image: "registry.access.redhat.com/ubi9/ubi:latest"
            python-version: "3.12"
          - distro: "RHEL 9"
            image: "registry.access.redhat.com/ubi9/ubi:latest"
            python-version: "3.13"
          - distro: "RHEL 9"
            image: "registry.access.redhat.com/ubi9/ubi:latest"
            python-version: "3.14"
          - distro: "RHEL 10"
            image: "registry.access.redhat.com/ubi10/ubi:latest"
            python-version: "3.12"
          - distro: "RHEL 10"
            image: "registry.access.redhat.com/ubi10/ubi:latest"
            python-version: "3.13"
          - distro: "RHEL 10"
            image: "registry.access.redhat.com/ubi10/ubi:latest"
            python-version: "3.14"
    container:
      image: ${{ matrix.image }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Install system packages
        run: |
          set -e
          # Install only what is missing: some base images ship
          # curl-minimal, which conflicts with the full curl package,
          # so an unconditional "install curl" would fail there.
          if command -v microdnf >/dev/null 2>&1; then PKG=microdnf; else PKG=dnf; fi
          command -v git  || $PKG install -y git
          command -v curl || $PKG install -y curl
          command -v git
          command -v curl
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies (uv provisions CPython ${{ matrix.python-version }})
        run: $HOME/.local/bin/uv sync --frozen
      - name: Run tests
        run: $HOME/.local/bin/uv run pytest -q

  test-linux-arm64:
    name: Tests (linux/arm64, glibc ${{ matrix.floor }}, py${{ matrix.python-version }})
    needs: quality
    # aarch64 Linux (Pi 4/5, Jetson, ARM dev boxes) has no hosted runner,
    # so the suite runs in an arm64 manylinux container under QEMU user-
    # mode emulation. The manylinux aarch64 images double as glibc-floor
    # checks for ARM (2.34 = the RHEL 9 floor, 2.39 = the RHEL 10 floor,
    # mirroring the x86_64 UBI jobs): all native dependencies ship
    # manylinux_2_34_aarch64 wheels, so "uv sync --frozen" verifies wheel
    # resolution and the suite verifies execution on the architecture.
    # The images bundle CPython under /opt/python (used via PATH); uv
    # provisions standalone interpreters as a fallback. Emulation is
    # slow, so at most two jobs run at a time.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Explicit combinations (same reason as the RHEL job: GitHub's
        # include-merge semantics would collapse the image entries).
        include:
          - floor: "2.34"
            image: "quay.io/pypa/manylinux_2_34_aarch64:latest"
            python-version: "3.12"
          - floor: "2.34"
            image: "quay.io/pypa/manylinux_2_34_aarch64:latest"
            python-version: "3.13"
          - floor: "2.34"
            image: "quay.io/pypa/manylinux_2_34_aarch64:latest"
            python-version: "3.14"
          - floor: "2.39"
            image: "quay.io/pypa/manylinux_2_39_aarch64:latest"
            python-version: "3.12"
          - floor: "2.39"
            image: "quay.io/pypa/manylinux_2_39_aarch64:latest"
            python-version: "3.13"
          - floor: "2.39"
            image: "quay.io/pypa/manylinux_2_39_aarch64:latest"
            python-version: "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Run tests in an arm64 manylinux container
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "${{ matrix.image }}"
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD:/src" \
            -w /src \
            -e UV_PYTHON \
            "${{ matrix.image }}" bash -c '
              set -eu
              # RHEL-based image: install only what is missing (git and
              # curl are prebuilt into the image; the checks are
              # defensive).
              if command -v microdnf >/dev/null 2>&1; then PKG=microdnf; else PKG=dnf; fi
              command -v git  || $PKG install -y git
              command -v curl || $PKG install -y curl
              command -v git
              command -v curl
              # Prefer the image-bundled CPython; uv provisions a
              # standalone interpreter when one is not present.
              ver="${UV_PYTHON//./}"
              if test -x "/opt/python/cp${ver}-cp${ver}/bin/python${UV_PYTHON}"; then
                export PATH="/opt/python/cp${ver}-cp${ver}/bin:$PATH"
              fi
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              uv sync --frozen
              uv run pytest -q
            '
