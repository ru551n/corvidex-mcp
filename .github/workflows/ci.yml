name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q

  test-rhel:
    name: Tests (${{ matrix.distro }}, py${{ matrix.python-version }})
    needs: quality
    # RHEL 9 and RHEL 10 have no hosted runners, so each runs as a
    # container on Ubuntu. The subscription-gated registry.redhat.com
    # rhel images need credentials, so the official UBI images are
    # used instead: free to pull, and they carry the same RHEL 9/10
    # user space (UBI 9 glibc 2.34 is the strictest floor in the
    # locked wheel set; UBI 10 is glibc 2.39, which is looser).
    # Python is not taken from the distro repos: uv provisions its own
    # standalone CPython (the same way a fresh user install works), so
    # the job only needs git + curl at runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: "RHEL 9"
            image: "registry.access.redhat.com/ubi9/ubi:latest"
          - distro: "RHEL 10"
            image: "registry.access.redhat.com/ubi10/ubi:latest"
        python-version: ["3.12", "3.13", "3.14"]
    container:
      image: ${{ matrix.image }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Install system packages
        run: |
          set -e
          # Install only what is missing: some base images ship
          # curl-minimal, which conflicts with the full curl package,
          # so an unconditional "install curl" would fail there.
          if command -v microdnf >/dev/null 2>&1; then PKG=microdnf; else PKG=dnf; fi
          command -v git  || $PKG install -y git
          command -v curl || $PKG install -y curl
          command -v git
          command -v curl
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies (uv provisions CPython ${{ matrix.python-version }})
        run: $HOME/.local/bin/uv sync --frozen
      - name: Run tests
        run: $HOME/.local/bin/uv run pytest -q
