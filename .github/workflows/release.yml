name: Release

# Builds both distribution artifacts, publishes the slim ones to PyPI,
# and attaches everything to a draft GitHub Release.
#
#   dist/         slim wheel + sdist  -> what a maintainer uploads to PyPI
#   dist-offline/ all-models wheel +  -> Release assets only; that wheel
#                 one dependency         is versioned <version>+offline,
#                 wheelhouse per         which PyPI refuses outright
#                 supported target
#
# Publishing uses PyPI Trusted Publishing (OIDC): the publish job mints a
# short-lived token from GitHub's identity provider, so no PyPI API token
# is stored, rotated, or reachable from any other job here. PyPI binds
# that trust to this exact repository and workflow *filename* — renaming
# this file breaks publishing until the publisher is updated on PyPI.
#
# Nothing is built, drafted, or published unless the full CI suite passes
# on the tagged commit. ci.yml is reused via workflow_call rather than
# copied, so the gate cannot drift away from the tests it claims to run.
#
# Only a tag push publishes. A workflow_dispatch run builds the artifacts
# and drafts a Release so they can be inspected, but never uploads: a
# version number is burned permanently on upload, and PyPI will not let
# the same one be re-used even after a delete.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # The full CI suite — lint, type-check, quality gate, and the whole
    # OS/Python matrix — run against the tagged commit. ci.yml itself is
    # reused rather than copied: a duplicated matrix drifts, and a
    # release gated on a stale copy of the tests is worse than no gate.
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build slim artifacts + offline matrix
    # Gated too, not just the publish job: a red suite should not leave a
    # draft Release full of assets sitting there looking releasable.
    # Serialising costs a few minutes on a rare operation and buys "if
    # anything is red, nothing exists".
    needs: test
    runs-on: ubuntu-latest
    # The offline side downloads ~0.9 GB of model weights once, packs a
    # 537 MB wheel, and then cross-downloads a ~55-wheel dependency
    # wheelhouse for each of the twelve targets (~0.9 GB of wheels on a
    # cold cache), so it is slower than a normal build job. Both caches
    # below turn a re-run into a few minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache the model weights between runs
        uses: actions/cache@v6
        with:
          # tools/bundle_model.py's default download cache. Bump the key
          # when the default models (config defaults) change.
          path: ~/.cache/corvidex-models
          key: corvidex-release-models-v1
          restore-keys: corvidex-release-models-v1

      - name: Cache the cross-downloaded dependency wheels
        uses: actions/cache@v6
        with:
          # pip's HTTP cache, shared by all twelve `pip download` runs.
          # Keyed on the lockfile: the wheel set only changes when the
          # resolved dependencies do.
          path: ~/.cache/pip
          key: corvidex-release-wheelhouse-${{ hashFiles('uv.lock') }}
          restore-keys: corvidex-release-wheelhouse-

      - name: Build the slim artifacts and the full offline matrix
        # Every target in tools/build_release.py's matrix. Each wheelhouse
        # is cross-downloaded from this one Linux runner
        # (`pip download --platform ... --python-version ...`), so no
        # macOS or Windows runner is involved, and each one is verified
        # before it is packed: the download must resolve completely and
        # every wheel in it must carry a tag that target asked for.
        run: |
          uv run --no-sync python tools/build_release.py --all \
            --model-source ~/.cache/corvidex-models

      - name: Check the PyPI artifacts
        # dist/ holds only the slim wheel + sdist; the offline bundle is
        # in dist-offline/, so this glob can never hand twine an archive
        # it cannot parse.
        run: uv run --no-sync --with twine twine check dist/*

      - name: Refuse to release an offline wheel without its local version
        # The one mistake that would matter: an all-models wheel that
        # looks like the public release and could be uploaded to PyPI.
        # Also asserts the offline set is complete, so a target that
        # silently stopped being packed cannot ship as a short release.
        run: |
          set -e
          ls dist-offline/*-offline-wheel.tar >/dev/null
          expected=$(uv run --no-sync python tools/build_release.py \
            --target-ids | wc -l)
          found=$(ls dist-offline/*-wheelhouse-*.tar.gz | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "::error::expected $expected wheelhouse archives, found $found"
            exit 1
          fi
          if ls dist/* | grep -q '+offline'; then
            echo "::error::an +offline artifact leaked into dist/ (the PyPI directory)"
            exit 1
          fi

      - name: Keep the PyPI artifacts for the publish job
        # Only dist/ — the offline bundle is a Release asset and must
        # never reach the job that talks to PyPI.
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

      - name: Summarize the artifact sizes
        run: |
          {
            echo "### Artifacts"
            echo
            echo '| Artifact | Size |'
            echo '| --- | --- |'
            for f in dist/* dist-offline/*; do
              printf '| `%s` | %s |\n' "$f" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release (draft)
        # Always a draft: a human checks the assets and publishes it.
        # `gh` is preinstalled on the runner, so no third-party action
        # and no extra credential is involved.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('untagged-{0}', github.run_id) }}
        run: |
          set -e
          cat > release-notes.md <<'NOTES'
          ## Install

          ```console
          pip install corvidex-mcp
          ```

          ## Air-gapped hosts

          An offline install needs **two** assets below, and the host
          then downloads nothing at install or at run time:

          1. `*-offline-wheel.tar` — the package with all three models
             embedded. Platform-independent: the same file for every
             machine and every Python version.
          2. `*-wheelhouse-<os>-<arch>-cp<py>.tar.gz` — the compiled
             dependency wheels for **your** platform and CPython
             version. Pick exactly one, e.g.
             `...-wheelhouse-linux-x86_64-cp312.tar.gz`.

          ```console
          tar xf corvidex-mcp-<version>-offline-wheel.tar
          tar xzf corvidex-mcp-<version>-wheelhouse-<target>.tar.gz
          cd corvidex-mcp-<version>-wheelhouse-<target>
          ./install.sh /opt/corvidex-venv      # install.ps1 on Windows
          /opt/corvidex-venv/bin/python -m corvidex_mcp.verify_offline
          ```

          The installer refuses a wheelhouse that does not match the
          interpreter it is pointed at, so a mismatched pair fails with
          a message rather than a broken venv. Targets: Linux
          x86_64/aarch64 (glibc 2.34+) and Windows x86-64 on CPython
          3.12/3.13/3.14, macOS 14+ on Apple Silicon on CPython
          3.12/3.13/3.14. Intel macOS is not covered (onnxruntime
          publishes no x86_64 macOS wheels), and neither is
          free-threaded CPython.

          Those assets are **not on PyPI** and cannot be: PyPI's 100 MB
          per-file limit is not raised for bundled model weights. The
          wheel is versioned `+offline` (a PEP 440 local version), which
          PyPI rejects outright.
          NOTES
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file release-notes.md \
            dist/*.whl dist/*.tar.gz \
            dist-offline/*-offline-wheel.tar \
            dist-offline/*-wheelhouse-*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    # Both gates. `needs` alone is not enough: GitHub skips a job whose
    # dependency failed, but an `if:` re-enables it, so the success()
    # check below keeps this job from ever running on a red suite.
    needs: [test, build]
    # Tag pushes only. A workflow_dispatch run is for inspecting the
    # artifacts, and must not spend a version number.
    if: github.ref_type == 'tag' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Overrides the workflow-level `contents: write`: this job needs no
    # repository write access, only the OIDC token PyPI verifies.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch the PyPI artifacts built above
        uses: actions/download-artifact@v8.0.1
        with:
          name: pypi-dist
          path: dist

      - name: Refuse to publish anything but the slim artifacts
        # The build job already checks this, but that check cannot
        # protect what this job actually uploads. An all-models wheel
        # reaching PyPI is the one unrecoverable mistake here, so it is
        # re-checked against the exact directory being published.
        run: |
          set -e
          ls dist/*.whl dist/*.tar.gz >/dev/null
          if ls dist/* | grep -q '+offline'; then
            echo "::error::an +offline artifact reached the publish job"
            exit 1
          fi

      - name: Publish
        # Trusted Publishing: no token, no secret. Authenticates with the
        # OIDC identity granted by `id-token: write` above.
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          # Fail loudly rather than silently skipping a version that is
          # already on PyPI — a re-run of a tag should not look like a
          # success when nothing was uploaded.
          skip-existing: false
          print-hash: true
